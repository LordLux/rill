name: rill
description: "Rill — native Windows YouTube client. Flutter UI over libmpv."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # `GetProcessTimes` and `mpv_client_api_version`, for Q3 and the artefact check.
  ffi: ^2.1.0

  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  # EXACT, not caret. A bump lands modern FFmpeg and reintroduces the F13 seek
  # freeze — the shipped 2023 build (mpv v0.36.0-403 / FFmpeg n6.0) seeks
  # ANDROID_VR streams 4/4 with no options at all; from Lavf 62.10.101 onward
  # ffmpeg soft-seeks instead and the same seeks go 0/4, frozen at the target
  # with nothing logged. See architecture.md F12, F13 and §2.4.
  media_kit_libs_windows_video: 1.0.11
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_riverpod: ^3.4.2
  meta: ^1.18.0
  silky_scroll: ^2.6.4
  # The accent has to survive a restart; one resetting each launch reads as broken.
  shared_preferences: ^2.3.2
  selectable: ^0.6.5
  async: ^2.11.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  animated_vector: ^0.2.2
  animated_vector_annotations:
  google_fonts: ^8.2.1
  flutter_inappwebview: 6.1.5
  flutter_secure_storage: 9.2.4
  bitsdojo_window: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.1
  # animated_vector_gen: DO NOT RE-ADD without reading this.
  #
  # It is what breaks `build_runner`, and the failure names nothing that points
  # at it: `dart compile kernel` crashes inside the FFI use-site transformer
  # with `type 'InvalidType' is not a subtype of type 'FunctionType'`, which
  # reads like an FFI bug in media_kit or in this app. It is neither.
  #
  # build_runner compiles a build script importing every builder in the graph,
  # and it compiles it with the plain Dart VM. `animated_vector_gen` →
  # `animated_vector_annotations` → `flutter`, and that package re-exports
  # `dart:ui` — so the build script drags the Flutter framework into a compiler
  # that has no `dart:ui`, every use site in it resolves to `InvalidType`, and
  # the first one the FFI transformer touches crashes the compile. Bisected
  # 2026-08-18: freezed, json_serializable, source_gen and build_runner's own
  # entrypoint each compile clean on their own; this one alone fails.
  #
  # Removing it makes every generator work again. It generated nothing — no
  # `@ShapeshifterAsset` exists in the tree. Re-adding it disables ALL codegen.

dependency_overrides:
  # **Empty on purpose. Do not add an override to make the tree resolve.**
  #
  # `source_gen: ^4.1.2` and `build: ^4.0.4` sat here from `16b70c7` — the same
  # commit that added `animated_vector_gen` and the analyzer/dart_style pair
  # below — until 2026-09-16, when they were tested out. Without them pub
  # resolves the identical versions (source_gen 4.2.4, build 4.0.7), listed as
  # transitive instead of "direct overridden", and build_runner,
  # test_suite_guard and lint_gate all pass. So all they did was switch off
  # constraint checking for two packages at the centre of codegen.
  #
  # **`analyzer` and `dart_style` are deliberately NOT overridden here.**
  #
  # They used to be (`analyzer: ">=10.0.0 <15.0.0"`, `dart_style: ^3.1.4`), and
  # that pair is what broke `build_runner` — differently from, and in addition
  # to, the FFI failure CLAUDE.md documents.
  #
  # An override bypasses constraint checking, so the wide analyzer range let pub
  # pick **13.0.0** and call it solved, while the packages that actually consume
  # it disagreed: `freezed` 3.2.6-dev.1 wants `analyzer >=12.0.0 <13.0.0`, and
  # `dart_style` 3.1.13 wants `>=13.1.0`. Both failures land at *compile* time
  # with messages about someone else's AST — `namePart isn't defined for
  # ExtensionTypeDeclaration` from dart_style, `Variable pattern 'type' doesn't
  # have the same type or finality` from freezed — and neither names a version.
  #
  # Pinning the way out is not available: analyzer 13.1 needs `meta ^1.18.3`
  # and `flutter_test` from this SDK pins `meta 1.18.0`. Letting pub solve it
  # unaided is what works, and the constraint the solver has to respect is the
  # one freezed declares.
  #
  # If codegen breaks again, check this block first: `dart run build_runner
  # build` failing inside a *package you did not change* is what a bad override
  # looks like from the outside.
  #
  # **Expect the lockfile to move backwards, and that is the fix working.**
  # Removing the overrides lets the solver pick a set that actually agrees, and
  # the whole generator toolchain settles a few versions down —
  # `analyzer 13.0.0 → 12.1.0`, `dart_style 3.1.13 → 3.1.8`,
  # `build_runner 2.16.1 → 2.15.1`, plus `build`, `source_gen` and
  # `_fe_analyzer_shared` alongside them. All six are `direct dev` or transitive
  # under it, so nothing shipped in the app changes. A reviewer looking only at
  # `pubspec.lock` sees six downgrades and no reason; this is the reason.

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/reddit.svg
    - assets/icons/facebook.svg
    - assets/icons/telegram.svg
