name: native_youtube
description: "Native Windows YouTube client — Flutter UI over libmpv."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # `GetProcessTimes` and `mpv_client_api_version`, for Q3 and the artefact check.
  ffi: ^2.1.0

  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  # EXACT, not caret. A bump lands modern FFmpeg and reintroduces the F13 seek
  # freeze — the shipped 2023 build (mpv v0.36.0-403 / FFmpeg n6.0) seeks
  # ANDROID_VR streams 4/4 with no options at all; from Lavf 62.10.101 onward
  # ffmpeg soft-seeks instead and the same seeks go 0/4, frozen at the target
  # with nothing logged. See architecture.md F12, F13 and §2.4.
  media_kit_libs_windows_video: 1.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
